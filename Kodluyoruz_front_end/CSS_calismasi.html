<!--CSS EKLEME YOLLARI
    Inline CSS->etiket içinde style kullanımı. Genellikle bir etikette değişim yapılacağı zaman yapılır.
        Yani küçük iş ve değişikliklerde kullanılır. 
    Internal CSS->head'in içinde bir style etiketi açıyoruz ve hangi etikette işlem yapmak sitiyorsak
        onun adını yazıyoruz ve bir boşluktan sonra süslü parantez açıyoruz ve yapmak itediğimiz işlemleri yapıyoruz.
    EXternal CSS->herhangi bir yerdeki CSS'i kendi dosyamıza ekleyebiliriz.head içinde link belirtilerek yazılır.
-->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Ekleme Yolları</title>
    <!--EXTERNAL CSS-->
    <link rel="stylesheet" href="CSS/kodluyoruz.css">
</head>
<body>
    <!--Inline CSS kullanımı-->
    <h1 style="color:darkred;font-size:20px;">CSS Ekleme Yolları</h1> 
    <h2>Inline css</h2>
    <p>Lorem ipsum dolor sit amet.</p>
    <h2>Internal css</h2>
    <!--INTERNAL CSS-->
    <style>    
       
    </style>
</body>
</html>
