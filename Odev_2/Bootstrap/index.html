<!--Yön ayarlamak için margin = m{direction}-(size) veya padding = p{direction}-(size)-->
<!--marjin kutuların diğer kutularla olan mesafesi.
   (Bütün yönlerden boşluk vericek aşağıdakiler.)
    m-0 margin :0 pixel karşılığı:0px
    m-1 margin :0.25 rem pixel karşılığı:4px
    m-2 margin :0.50 ram pixel karşılığı:8px
    m-3 margin :1ram pixel karşılığı:16px
    m-4 margin :1.5ram pixel karşılığı:24px
    m-5 margin :3 ram pixel karşılığı:48px


    t-top = yukarıdan boşluk
    b-bottom = aşağıdan boşluk
    s-satrt = soldan boşluk
    e-end = sağdan boşluk 
    x = yatay ekseni temsil ediyor(hem sağ hem soldan boşluk vermek için)
    y = dikey ekseni temsil ediyor(hem yukarı hem de aşağıdan boşluk vermek için)

    m'ye direkt kullanmak istediğimiz niceliğin baş harfini ekliyoruz mt, mb gibi


    Responsive Spacing

    x5  - <576px
    sm  - >=576px
    md  ->=768px
    lg  ->992px
    xl  ->=1200px
    xxl ->=1400px

    mb-md-5  :aşağıdan 3 ramlik bir boşluk vericez
-->


<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
  </head>
  <body>
    <div class="bg-primary text-white p-3 mb-3">
      Bu kutunun etrafında padding var, dışarıda marjin var
    </div>
      
    <div class="bg-success text-white p-5">Bu kutuda padding değeri oldukça fazla.</div>
    <!--Bu padding birden beşe kadar seçebiliyorsun-->
    <div class="bg-warning text-dark mt-4 mb-5 p-2 ">Yukarıdan bir buçuk ram, aşağıdan 3 ram boşluk var.</div><!--marjin buttom ve marjin top kullandık.-->


    <div class="bg-info text-white p-2 mt-2 mt-sm-5">Bu kutunun mb eğer ekran genişliği sm 5 olacak. </div>
    <!--1:İnfo rengini al 2: metin beyaz olsun 3:-->
  </body>
</html>
